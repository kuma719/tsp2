<!-- ui-sandbox.html -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Sandbox - TSP QRアルバム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --brand-1: #0ea5e9; /* sky-500 */
      --brand-2: #2563eb; /* blue-600 */
      --accent-1:#10b981; /* emerald-500 */
      --radius-xl: 1rem;
      --shadow-1: 0 10px 25px rgba(0,0,0,.08);
    }
    .card { border-radius: var(--radius-xl); box-shadow: var(--shadow-1); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 sm:p-8 py-8">
    <header class="mb-8">
      <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border border-white/20">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-sky-600 to-blue-600 bg-clip-text text-transparent">
              TSP QRアルバム（UI Sandbox）
            </h1>
            <p class="text-sm text-slate-500 mt-1">※ 見た目だけ編集できます（機能なし）</p>
          </div>
          <div class="flex items-center gap-3 bg-gradient-to-r from-emerald-50 to-green-50 px-4 py-2 rounded-full border border-emerald-200">
            <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-sm font-medium text-emerald-700">モックデータ表示中</span>
          </div>
        </div>
      </div>
    </header>

    <section class="mb-6">
      <div class="rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 shadow-xl p-6 text-white">
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <span class="px-3 py-1 rounded-full text-xs bg-white/20 backdrop-blur-sm border border-white/30">
            統一URL
          </span>
          <span class="px-3 py-1 rounded-full text-xs bg-white/20 backdrop-blur-sm border border-white/30">
            ブラウザ
          </span>
          <span class="px-3 py-1 rounded-full text-xs bg-emerald-500/30 backdrop-blur-sm border border-emerald-400/50">
            PWA
          </span>
        </div>
        <p class="text-sm leading-relaxed">
          このページは UI 用のサンドボックスです。Tailwind のクラスを編集して見た目を変えてください。
        </p>
      </div>
    </section>

    <div class="grid gap-6">
      <!-- タイトル/メモ -->
      <div class="rounded-3xl bg-white/90 backdrop-blur-sm shadow-xl p-6 sm:p-8 border border-white/20">
        <h2 class="text-xl font-bold mb-4 text-slate-800">タイトル / メモ</h2>
        <input id="title" type="text" placeholder="アルバムのタイトルを入力..."
          class="w-full mb-4 px-4 py-3 rounded-xl border-2 border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white/50"/>
        <textarea id="notes" rows="5" placeholder="旅のメモ、気づき、キャプション…"
          class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white/50"></textarea>
      </div>

      <!-- ギャラリー（モック） -->
      <div class="rounded-3xl bg-white/90 backdrop-blur-sm shadow-xl p-6 sm:p-8 border border-white/20">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-xl font-bold text-slate-800">写真 / 動画</h2>
          <span class="text-xs text-slate-500">（これはモックです）</span>
        </div>
        <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </div>

      <!-- バックアップ / 共有（モック） -->
      <div class="rounded-3xl bg-white/90 backdrop-blur-sm shadow-xl p-6 sm:p-8 border border-white/20">
        <h2 class="text-xl font-bold mb-5 text-slate-800">バックアップ / 復元（モック）</h2>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-5">
          <button class="px-5 py-3 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 text-white">書き出し</button>
          <button class="px-5 py-3 rounded-xl bg-gradient-to-r from-slate-700 to-black text-white">読み込み</button>
          <button class="px-5 py-3 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 text-white">削除</button>
        </div>
        <div class="bg-gradient-to-r from-emerald-50 to-green-50 rounded-2xl p-4 border border-emerald-200">
          <button class="w-full px-5 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-green-600 text-white">
            共有リンクを作成（1時間有効）
          </button>
          <p class="text-xs text-slate-600 mt-3">
            ※ サンドボックスではダミーの挙動のみ。UIの見た目調整に集中できます。
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // モック画像（データURL：青/紫/緑の正方形）
    const mocks = [
      'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="%230ea5e9"/></svg>',
      'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="%238b5cf6"/></svg>',
      'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="%2310b981"/></svg>'
    ];

    const gallery = document.getElementById('gallery');
    for (let i=0; i<8; i++){
      const src = mocks[i % mocks.length];
      const card = document.createElement('div');
      card.className = 'relative overflow-hidden rounded-2xl border border-slate-200 group';
      card.innerHTML = `
        <img src="${src}" class="w-full h-40 object-cover" />
        <button class="absolute top-2 left-2 rounded-full bg-black/40 text-white p-2 opacity-0 group-hover:opacity-100 transition">
          <!-- SVGの×アイコン（依存なし） -->
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      `;
      gallery.appendChild(card);
    }
  </script>
</body>
</html>
